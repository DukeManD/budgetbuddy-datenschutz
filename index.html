<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parita – Datenschutz ist umgezogen</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://parita-app.netlify.app/datenschutz/">
<!--
  Die Datenschutzerklaerung wird jetzt mit der Website gepflegt
  (BudgetBuddy-Repo, website/datenschutz/) und liegt unter
  parita-app.netlify.app/datenschutz/. Diese Seite bleibt nur, damit alte Links
  weiter ankommen.

  Zuerst das Skript: es nimmt den Anker mit (#datenschutz, #loeschen).
  Das meta refresh ist der Weg fuer alle, bei denen kein Skript laeuft --
  dort geht der Anker verloren, man landet oben auf der Seite, und oben
  steht ohnehin die Anleitung zum Loeschen.
-->
<script>
  location.replace("https://parita-app.netlify.app/datenschutz/" + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://parita-app.netlify.app/datenschutz/">
<style>
  :root { --ground: #F8F6F4; --ink: #2B2826; --muted: #6E6862; --accent: #3D684D; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #171615; --ink: #F0EBE5; --muted: #9C948B; --accent: #679E7A; }
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  .page { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .8rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <h1>Die Datenschutzerklärung ist umgezogen</h1>
  <p>BudgetBuddy heisst jetzt Parita. Datenschutzerklärung und Anleitung zum Löschen deiner Daten findest du hier:</p>
  <p><a href="https://parita-app.netlify.app/datenschutz/">parita-app.netlify.app/datenschutz</a></p>
</div>
</body>
</html>
